name: Notificar Débitos

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch: {}

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de notificação
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET não configurado no repositório"; exit 1; }
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://pmgmarketing.vercel.app/api/notificar-debitos
