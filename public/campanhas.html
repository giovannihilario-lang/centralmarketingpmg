<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PMG Connect — Campanhas</title>
  <link rel="stylesheet" href="/assets/campanhas-fast-v4.css?v=4.0.0">
  <script defer src="/assets/campanhas-fast-v4.js?v=4.0.0"></script>
  <script async src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" onload="window.dispatchEvent(new Event('pmg-lucide-ready'))"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="/imagenssite/pmglogo.png" alt="PMG"></div>
        <div><strong>PMG Connect</strong><span>Campaign Studio</span></div>
        <button class="icon-btn mobile-only" type="button" data-action="close-sidebar" aria-label="Fechar menu"><i data-lucide="x"></i></button>
      </div>

      <nav class="nav" aria-label="Navegação principal">
        <button class="nav-item is-active" type="button" data-view="dashboard"><i data-lucide="layout-dashboard"></i><span>Visão geral</span></button>
        <button class="nav-item" type="button" data-view="campaigns"><i data-lucide="megaphone"></i><span>Campanhas</span><b id="navCampaignCount">0</b></button>
        <button class="nav-item" type="button" data-view="representatives"><i data-lucide="users"></i><span>Representantes</span></button>
      </nav>

      <div class="side-status" id="sideStatus">
        <div class="side-status-head"><span class="status-dot"></span><strong>API local</strong></div>
        <p>Conectando ao servidor PMG sem bloquear a interface.</p>
        <small id="sideStatusDetail">Aguardando resposta...</small>
      </div>

      <div class="side-footer">
        <button class="nav-item" type="button" data-action="settings"><i data-lucide="settings"></i><span>Configurações</span></button>
        <a class="nav-item" href="/central.html"><i data-lucide="house"></i><span>Voltar ao Connect</span></a>
      </div>
    </aside>

    <div class="sidebar-backdrop" data-action="close-sidebar"></div>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-title">
          <button class="icon-btn mobile-only" type="button" data-action="open-sidebar" aria-label="Abrir menu"><i data-lucide="menu"></i></button>
          <div><span id="pageEyebrow">Central comercial</span><h1 id="pageTitle">Visão geral</h1></div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" type="button" data-action="refresh" title="Atualizar dados"><i data-lucide="refresh-cw"></i></button>
          <button class="icon-btn" type="button" data-action="theme" title="Alternar tema"><i data-lucide="moon"></i></button>
          <button class="primary-btn" type="button" data-action="new-campaign"><i data-lucide="plus"></i><span>Nova campanha</span></button>
        </div>
      </header>
      <div class="progress-line" id="progressLine"></div>
      <section class="page" id="pageRoot" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="campaign-modal" id="campaignModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <div><span class="eyebrow">Construtor de campanha</span><h2 id="modalTitle">Nova campanha</h2></div>
        <button class="icon-btn" type="button" data-action="close-modal" aria-label="Fechar"><i data-lucide="x"></i></button>
      </header>
      <div class="wizard-shell">
        <aside class="wizard-nav" id="wizardNav"></aside>
        <div class="wizard-content">
          <div class="wizard-progress"><span id="wizardProgress"></span></div>
          <div id="wizardStep"></div>
        </div>
      </div>
      <footer class="modal-footer">
        <div id="modalFootStatus" class="modal-foot-status"></div>
        <div class="modal-actions">
          <button class="secondary-btn" type="button" data-action="previous-step"><i data-lucide="arrow-left"></i>Anterior</button>
          <button class="secondary-btn" type="button" data-action="next-step">Próximo<i data-lucide="arrow-right"></i></button>
          <button class="primary-btn" type="button" data-action="save-campaign"><i data-lucide="save"></i>Salvar campanha</button>
        </div>
      </footer>
    </section>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden>
    <aside class="performance-drawer" id="performanceDrawer">
      <header class="drawer-header">
        <div><span class="eyebrow">Apuração e ranking</span><h2 id="performanceTitle">Performance</h2></div>
        <button class="icon-btn" type="button" data-action="close-performance"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-body" id="performanceBody"></div>
    </aside>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
</body>
</html>
