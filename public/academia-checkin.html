<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in Academia PMG</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f5f6f5;color:#14241b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(540px,100%);background:#fff;border:1px solid #dce4df;border-radius:20px;padding:28px;box-shadow:0 16px 44px #1b362818}h1{margin:.2em 0}.training{padding:16px;background:#f4f8f5;border-radius:12px;margin:20px 0}.field{display:grid;gap:7px;margin:16px 0}.field input{min-height:50px;padding:12px;border:1px solid #b9c6be;border-radius:10px;font-size:18px}.btn{min-height:50px;width:100%;border:0;border-radius:11px;background:#173d2c;color:#fff;font-weight:800;font-size:16px}.status{margin-top:16px;padding:14px;border-radius:10px}.ok{background:#e8f8ef;color:#15552f}.error{background:#fff0ef;color:#8a211b}.muted{color:#69766f}</style></head><body><main class="card"><strong>ACADEMIA PMG</strong><h1>Confirmar presença</h1><p class="muted">Use seu código de representante, e-mail ou telefone informado na inscrição.</p><div id="training" class="training">Validando treinamento…</div><form id="form"><label class="field"><span>Seu identificador</span><input id="identifier" autocomplete="email" required placeholder="Código, e-mail ou telefone"></label><button id="checkin" class="btn">Confirmar presença</button></form><div id="status"></div><p class="muted">Não conseguiu fazer o check-in? A equipe PMG pode registrar sua presença manualmente.</p></main><script type="module" src="/assets/academia-checkin.js?v=2.0.0"></script></body></html>
