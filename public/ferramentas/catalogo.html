<script>
(function(){
  const KEY='pmg-demandas-accessibilidade-v2';
  function storedTheme(){
    try{return JSON.parse(localStorage.getItem(KEY)||'{}').theme==='dark'?'dark':'light'}catch(_){return'light'}
  }
  window.applyCatalogTheme=function(theme){
    document.body.classList.toggle('catalog-dark',theme==='dark');
    document.documentElement.style.colorScheme=theme==='dark'?'dark':'light';
    const btn=document.getElementById('catalogThemeBtn');
    if(btn) btn.setAttribute('aria-pressed',String(theme==='dark'));
  };
  window.toggleCatalogTheme=function(){
    const dark=!document.body.classList.contains('catalog-dark');
    let saved={};
    try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}
    saved.theme=dark?'dark':'light';
    localStorage.setItem(KEY,JSON.stringify(saved));
    applyCatalogTheme(saved.theme);
  };
  document.addEventListener('DOMContentLoaded',()=>applyCatalogTheme(storedTheme()));
})();
</script>

function hexToRgb(hex) {
  const h = hex.replace('#','');
  return { r: parseInt(h.substr(0,2),16), g: parseInt(h.substr(2,2),16), b: parseInt(h.substr(4,2),16) };
}
function rgbToHex(r,g,b) {
  return '#' + [r,g,b].map(x => Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');
}
function shade(hex, percent) {
  const { r, g, b } = hexToRgb(hex);
  const alvo = percent < 0 ? 0 : 255;
  const p = Math.abs(percent) / 100;
  return rgbToHex(r + (alvo - r) * p, g + (alvo - g) * p, b + (alvo - b) * p);
}

}

function decodificarEntidadesProduto(valor) {
  // Alguns nomes chegam da base com aspas codificadas (&quot;, &#34;, etc.).
  // Se isso não for limpo antes da comparação, "180 ML" vira QUOT 180 ML QUOT
  // e um produto visualmente idêntico acaba sendo tratado como diferente.
  return String(valor || '')
    .replace(/&quot;|&#0*34;|&#x0*22;/gi, '"')
    .replace(/&apos;|&#0*39;|&#x0*27;/gi, "'")
    .replace(/&nbsp;|&#0*160;|&#x0*a0;/gi, ' ')
    .replace(/&amp;/gi, '&');
}

function normalizarNomeProduto(valor) {
  return decodificarEntidadesProduto(valor)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    // Resíduos de entidades HTML mal decodificadas também são descartados.
    .replace(/\b(?:QUOT|APOS|NBSP)\b/g, ' ')
    .replace(/[^A-Z0-9]+/g, ' ')
    .trim()
    .replace(/\s+/g, ' ');
}

function tokensProduto(normalizado) {
  return String(normalizado || '').split(' ').filter(Boolean);
}

function numerosProduto(normalizado) {
  return tokensProduto(normalizado).filter(token => /^\d+$/.test(token));
}

function diceTokensProduto(a, b) {
  const aa = tokensProduto(a);
  const bb = tokensProduto(b);
  if (!aa.length || !bb.length) return 0;
  const contagem = new Map();
  aa.forEach(t => contagem.set(t, (contagem.get(t) || 0) + 1));
  let inter = 0;
  bb.forEach(t => {
    const qtd = contagem.get(t) || 0;
    if (qtd > 0) {
      inter++;
      contagem.set(t, qtd - 1);
    }
  });
  return (2 * inter) / (aa.length + bb.length);
}

function diceBigramasProduto(a, b) {
  const compactar = valor => String(valor || '').replace(/\s+/g, '');
  const aa = compactar(a);
  const bb = compactar(b);
  if (!aa || !bb) return 0;
  if (aa === bb) return 1;
  if (aa.length < 2 || bb.length < 2) return 0;
  const mapa = new Map();
  for (let i = 0; i < aa.length - 1; i++) {
    const bi = aa.slice(i, i + 2);
    mapa.set(bi, (mapa.get(bi) || 0) + 1);
  }
  let inter = 0;
  for (let i = 0; i < bb.length - 1; i++) {
    const bi = bb.slice(i, i + 2);
    const qtd = mapa.get(bi) || 0;
    if (qtd > 0) {
      inter++;
      mapa.set(bi, qtd - 1);
    }
  }
  return (2 * inter) / ((aa.length - 1) + (bb.length - 1));
}

function numerosCompativeisProduto(a, b) {
  const na = numerosProduto(a);
  const nb = numerosProduto(b);
  if (!na.length || !nb.length) return true;
  // Evita que a busca aproximada troque, por exemplo, PÁ 35 CM por PÁ 38 CM.
  // Para nomes longos, permitimos pequenas diferenças de embalagem, mas exigimos
  // que a maior parte dos números continue coincidindo.
  const contagem = new Map();
  na.forEach(n => contagem.set(n, (contagem.get(n) || 0) + 1));
  let inter = 0;
  nb.forEach(n => {
    const qtd = contagem.get(n) || 0;
    if (qtd > 0) {
      inter++;
      contagem.set(n, qtd - 1);
    }
  });
  const cobertura = inter / Math.max(na.length, nb.length);
  return cobertura >= 0.75;
}

function pontuarCorrespondenciaProduto(termo, produto) {
  const nome = normalizarNomeProduto(produto.nome);
  if (!termo || !nome) return 0;
  if (nome === termo) return 1;

  if (!numerosCompativeisProduto(termo, nome)) return 0;

  if (nome.includes(termo) || termo.includes(nome)) {
    const menor = Math.min(nome.length, termo.length);
    const maior = Math.max(nome.length, termo.length);
    return 0.93 + 0.06 * (menor / maior);
  }

  const tokens = diceTokensProduto(termo, nome);
  const chars = diceBigramasProduto(termo, nome);
  return (tokens * 0.68) + (chars * 0.32);
}

function nomeProdutoParaExibicao(produto) {
  const nome = String((produto && produto.nome) || '').trim();
  const unidade = String((produto && produto.unidade) || '').trim();
  if (!nome || !unidade) return nome;
  const m = nome.match(/\(([^)]+)\)\s*$/);
  if (m && normalizarNomeProduto(m[1]) === normalizarNomeProduto(unidade)) {
    return nome.slice(0, m.index).trim();
  }
  return nome;
}

function separarListaProdutos(valor) {
  return String(valor || '')
    .split(/(?:\r?\n)+|;\s*|,\s*(?=[A-ZÁÀÂÃÉÊÍÓÔÕÚÜÇ"'])/i)
    .map(item => item.trim())
    .filter(Boolean);
}

function analisarListaProdutos() {
  const campo = document.getElementById('poolBulkFilter');
  const textoLista = campo ? campo.value : '';
  if (poolListaCache.texto === textoLista && poolListaCache.revisao === catalogoProdutosRevisao && poolListaCache.resultado) {
    return poolListaCache.resultado;
  }
  const itensOriginais = separarListaProdutos(textoLista);
  const termos = [];
  const vistos = new Set();

  itensOriginais.forEach(original => {
    const normalizado = normalizarNomeProduto(original);
    if (!normalizado || vistos.has(normalizado)) return;
    vistos.add(normalizado);
    termos.push({ original, normalizado });
  });

  if (!termos.length) {
    const resultado = { ativo: false, termos: [], ids: null, naoEncontrados: [], correspondenciasAjustadas: [], resolvidos: [], produtosOrdenados: [] };
    poolListaCache = { texto: textoLista, revisao: catalogoProdutosRevisao, resultado };
    return resultado;
  }

  const porNome = new Map();
  TODOS_PRODUTOS.forEach(produto => {
    const chave = normalizarNomeProduto(produto.nome);
    if (!porNome.has(chave)) porNome.set(chave, []);
    porNome.get(chave).push(produto);
  });

  const ids = new Set();
  const naoEncontrados = [];
  const correspondenciasAjustadas = [];
  const resolvidos = [];
  const produtosOrdenados = [];
  termos.forEach(termo => {
    let candidatos = porNome.get(termo.normalizado) || [];

    // Se não houver igualdade exata, procura a melhor variação do cadastro.
    // Aspas, entidades HTML, pequenas diferenças de embalagem e grafia deixam
    // de eliminar um item inteiro da lista. A margem entre 1º e 2º lugar evita
    // escolher automaticamente quando existem dois tamanhos muito parecidos.
    if (!candidatos.length && termo.normalizado.length >= 8) {
      const ranking = TODOS_PRODUTOS
        .map(produto => ({ produto, score: pontuarCorrespondenciaProduto(termo.normalizado, produto) }))
        .filter(item => item.score >= 0.84)
        .sort((a, b) => b.score - a.score);

      const melhor = ranking[0];
      const segundo = ranking[1];
      const margemSegura = !segundo || (melhor.score - segundo.score) >= 0.035 || melhor.score >= 0.965;
      if (melhor && margemSegura) {
        candidatos = [melhor.produto];
        correspondenciasAjustadas.push({
          informado: termo.original,
          encontrado: melhor.produto.nome,
          score: melhor.score,
        });
      }
    }

    if (!candidatos.length) naoEncontrados.push(termo.original);
    const produtosDoTermo = [];
    candidatos.forEach(produto => {
      ids.add(produto.id);
      produtosDoTermo.push(produto);
      if (!produtosOrdenados.some(item => item.id === produto.id)) produtosOrdenados.push(produto);
    });
    resolvidos.push({ ...termo, produtos: produtosDoTermo });
  });

  const resultado = { ativo: true, termos, ids, naoEncontrados, correspondenciasAjustadas, resolvidos, produtosOrdenados };
  poolListaCache = { texto: textoLista, revisao: catalogoProdutosRevisao, resultado };
  return resultado;
}

async function copiarProdutosNaoEncontrados() {
  const analise = analisarListaProdutos();
  if (!analise.naoEncontrados.length) return;
  const texto = analise.naoEncontrados.join(', ');
  try {
    await navigator.clipboard.writeText(texto);
    showToast(`${analise.naoEncontrados.length} item${analise.naoEncontrados.length !== 1 ? 's' : ''} não encontrado${analise.naoEncontrados.length !== 1 ? 's' : ''} copiado${analise.naoEncontrados.length !== 1 ? 's' : ''}.`);
  } catch (_) {
    showToast('Não foi possível copiar automaticamente.');
  }
}

function aplicarSubcategoriasDaLista(analise) {
  if (!analise?.ativo || !Array.isArray(analise.resolvidos) || !analise.resolvidos.length) return null;

  const produtosEncontrados = analise.resolvidos.flatMap(item => item.produtos || []);
  const categorias = [...new Set(produtosEncontrados.map(p => p.categoria).filter(Boolean))];
  if (categorias.length !== 1) return null;

  const categoria = categorias[0];
  const plano = SUBCATEGORIAS_CATALOGO[categoria];
  if (!plano?.length) return null;

  const totalEsperado = plano.reduce((soma, item) => soma + Number(item[1] || 0), 0);
  // A planilha de textos possui uma lista completa por categoria. Só usamos a
  // divisão posicional quando a quantidade colada corresponde ao plano inteiro;
  // assim uma lista parcial não ganha subcategoria errada por acidente.
  if (analise.termos.length !== totalEsperado) return null;

  let cursor = 0;
  plano.forEach(([subcategoria, quantidade]) => {
    const limite = cursor + quantidade;
    analise.resolvidos.slice(cursor, limite).forEach(item => {
      (item.produtos || []).forEach(produto => { produto.subcategoria = subcategoria; });
    });
    cursor = limite;
  });
  return categoria;
}

function subtituloAutomaticoDaPagina(pg) {
  const subcategorias = [];
  (pg.produtos || []).forEach(id => {
    const produto = TODOS_PRODUTOS.find(p => p.id === id);
    const sub = String(produto?.subcategoria || '').trim();
    if (sub && !subcategorias.includes(sub)) subcategorias.push(sub);
  });
  return subcategorias.join(' • ');
}

function atualizarSubtitulosAutomaticos(categoria = null) {
  pages.forEach(pg => {
    if (categoria && pg.titulo !== categoria) return;
    const auto = subtituloAutomaticoDaPagina(pg);
    if (auto) {
      pg.subtitulo = auto;
      pg.subtituloAuto = true;
    } else if (pg.subtituloAuto) {
      pg.subtitulo = '';
      pg.subtituloAuto = false;
    }
  });
}

function criarPaginaDepoisDa(paginaBase, subtitulo = '') {
  const nova = {
    id: nextPageId++,
    titulo: paginaBase.titulo,
    subtitulo,
    subtituloAuto: false,
    produtos: [],
    cor: paginaBase.cor || null,
  };
  const indice = pages.findIndex(p => p.id === paginaBase.id);
  pages.splice(indice >= 0 ? indice + 1 : pages.length, 0, nova);
  return nova;
}

function normalizarPaginasParaLimite() {
  let alterou = false;
  for (let i = 0; i < pages.length; i++) {
    const pg = pages[i];
    if (!Array.isArray(pg.produtos)) pg.produtos = [];
    if (pg.produtos.length <= MAX_PRODUTOS_POR_PAGINA) continue;

    const excedentes = pg.produtos.splice(MAX_PRODUTOS_POR_PAGINA);
    let posicao = i + 1;
    for (let j = 0; j < excedentes.length; j += MAX_PRODUTOS_POR_PAGINA) {
      pages.splice(posicao++, 0, {
        id: nextPageId++,
        titulo: pg.titulo,
        subtitulo: '',
        subtituloAuto: false,
        produtos: excedentes.slice(j, j + MAX_PRODUTOS_POR_PAGINA),
        cor: pg.cor || null,
      });
    }
    alterou = true;
  }
  return alterou;
}

function moverProdutosParaPaginaComOverflow(pid, produtos) {
  const alvo = pages.find(p => p.id === pid);
  if (!alvo || !produtos.length) return { adicionados: 0, novasPaginas: 0 };

  const ids = [...new Set(produtos.map(p => typeof p === 'object' ? p.id : p).filter(id => id != null))];
  pages.forEach(pg => { pg.produtos = pg.produtos.filter(id => !ids.includes(id)); });

  let paginaAtual = alvo;
  let novasPaginas = 0;
  let adicionados = 0;

  ids.forEach(id => {
    if (paginaAtual.produtos.length >= MAX_PRODUTOS_POR_PAGINA) {
      paginaAtual = criarPaginaDepoisDa(paginaAtual, '');
      novasPaginas++;
    }
    paginaAtual.produtos.push(id);
    adicionados++;
  });

  return { adicionados, novasPaginas };
}

function produtosFiltradosDoPool() {
  const catFilter = (document.getElementById('poolCatFilter') || {}).value || '';
  const searchRaw = ((document.getElementById('poolSearch') || {}).value || '').trim().toLowerCase();
  const analise = analisarListaProdutos();
  atualizarResumoListaProdutos(analise);

  const filtered = TODOS_PRODUTOS.filter(p => {
    const matchCat = !catFilter || p.categoria === catFilter;
    const matchLista = !analise.ativo || analise.ids.has(p.id);
    const matchText = !searchRaw || p.nome.toLowerCase().includes(searchRaw);
    return matchCat && matchLista && matchText;
  });

  return { filtered, analise };
}

}
function clearProdImage(prodId) {
  delete prodImages[prodId];
  renderProdImgList(); renderPreview();
}
function renderProdImgList() {
  const list = document.getElementById('prodImgList');
  if (!list) return;
  const catFilter = (document.getElementById('imgCatFilter') || {}).value || '';
  const prods = catFilter ? TODOS_PRODUTOS.filter(p => p.categoria === catFilter) : TODOS_PRODUTOS;
  list.innerHTML = '';
  prods.forEach(p => {
    const hasImg = !!prodImages[p.id];
    const row = document.createElement('div');
    row.className = 'prod-img-row';
    row.innerHTML = `
      ${hasImg
        ? `<img class="prod-img-thumb" src="${prodImages[p.id]}" alt="${p.nome}">`
        : `<div class="prod-img-thumb-placeholder"><input type="file" accept="image/*" onchange="onProdImageUpload(this,${p.id})">
           <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>`}
      <span class="prod-img-name">${p.nome}</span>
      <div class="prod-img-actions">
        <span class="btn-upload-prod">${hasImg?'↺ Trocar':'+ Enviar'}<input type="file" accept="image/*" onchange="onProdImageUpload(this,${p.id})"></span>
        ${hasImg?`<button class="btn-clear-prod" onclick="clearProdImage(${p.id})">✕</button>`:''}
      </div>`;
    list.appendChild(row);
  });
}

// ── CORES ──
function buildColorGrid() {
  const grid = document.getElementById('colorGrid');
  if (!grid) return;
  grid.innerHTML = '';
  Object.keys(colors_state).forEach(key => {
    const row = document.createElement('div');
    row.className = 'color-row';
    row.innerHTML = `<span class="color-label">${COLOR_LABELS[key]}</span>
      <div class="color-input-wrap">
        <input type="color" value="${colors_state[key]}" data-key="${key}" oninput="onColorChange(this)">
        <input type="text" value="${colors_state[key]}" data-key="${key}" oninput="onColorText(this)" maxlength="7">
      </div>`;
    grid.appendChild(row);
  });
}
function onColorChange(el) {
  colors_state[el.dataset.key] = el.value;
  el.parentElement.querySelector('input[type=text]').value = el.value;
  applyColors(); renderPreview();
  salvarDebounce()
}
function onColorText(el) {
  const val = el.value;
  if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
    colors_state[el.dataset.key] = val;
    el.parentElement.querySelector('input[type=color]').value = val;
    applyColors(); renderPreview();
  }
}

// ── CADASTRO ──
function cadAddProduct() {
  const nome = document.getElementById('cadNome').value.trim().toUpperCase();
  const unidade = document.getElementById('cadUnidade').value.trim().toUpperCase();
  const categoria = document.getElementById('cadCategoria').value;
  if (!nome) { showToast('Informe o nome do produto.'); return; }
  if (!unidade) { showToast('Informe a unidade/embalagem.'); return; }
  if (!categoria) { showToast('Selecione a categoria.'); return; }
  const prod = { id: nextProdId++, nome, unidade, categoria };
  TODOS_PRODUTOS.push(prod);
  catalogoProdutosRevisao++;
  const pg = pages.find(p => p.titulo === categoria);
  if (pg) moverProdutosParaPaginaComOverflow(pg.id, [prod.id]);
  document.getElementById('cadNome').value = '';
  document.getElementById('cadUnidade').value = '';
  renderCadList(); renderPanel(); renderPreview();
  showToast(`"${nome}" adicionado!`);
}
function cadDeleteProduct(id) {
  TODOS_PRODUTOS = TODOS_PRODUTOS.filter(p => p.id !== id);
  catalogoProdutosRevisao++;
  pages.forEach(pg => { pg.produtos = pg.produtos.filter(pid => pid !== id); });
  delete prodImages[id];
  renderCadList(); renderProdImgList(); renderPanel(); renderPreview();
}
function renderCadList() {

    return matchText && matchCat;

// ── PÁGINAS ──
function addPage() {
  const referencia = pages.find(p => p.id === openPage);
  if (referencia) {
    const nova = criarPaginaDepoisDa(referencia, '');
    openPage = nova.id;
  } else {
    const nova = { id: nextPageId++, titulo: 'Nova Página', subtitulo: '', subtituloAuto: false, produtos: [], cor: null };
    pages.push(nova);
    openPage = nova.id;
  }
  renderPanel(); renderPreview(); salvarDebounce();
}
function updatePageTitulo(pid, val) {
  const pg = pages.find(p => p.id === pid);
  if (pg) { pg.titulo = val; renderPreview(); }
  salvarDebounce()
}
function updatePageSubtitulo(pid, val) {
  const pg = pages.find(p => p.id === pid);
  if (pg) { pg.subtitulo = val; pg.subtituloAuto = false; renderPreview(); }
  salvarDebounce()
}
function removePage(pid) {
  if (pages.length === 1) { showToast('Precisa ter pelo menos uma página.'); return; }
  pages = pages.filter(p => p.id !== pid);
  if (openPage === pid) openPage = null;
  renderPanel(); renderPreview();
  salvarDebounce()
}
function togglePage(pid) {
  openPage = openPage === pid ? null : pid;
  renderPanel();
  
}
function removeProductFromPage(pid, prodId) {
  const pg = pages.find(p => p.id === pid);
  if (pg) pg.produtos = pg.produtos.filter(id => id !== prodId);
  atualizarSubtitulosAutomaticos(pg?.titulo || null);
  renderPanel(); renderPreview();
  salvarDebounce()
}
function addProductToPage(pid, prodId) {
  const resultado = moverProdutosParaPaginaComOverflow(pid, [prodId]);
  const categoriaPagina = pages.find(p => p.id === pid)?.titulo || null;
  atualizarSubtitulosAutomaticos(categoriaPagina);
  renderPanel(); renderPreview(); salvarDebounce();
  if (resultado.novasPaginas) showToast('Página cheia: criei a próxima página com o mesmo título.');
}

// ── POOL ──
function renderPool() {
  const list = document.getElementById('poolList');
  if (!list) return;
  const assigned = assignedPages();
  const { filtered } = produtosFiltradosDoPool();

  list.innerHTML = filtered.length === 0
    ? '<div style="font-size:10px;color:#BDBDBD;text-align:center;padding:10px">Nenhum produto encontrado</div>'
    : '';

  filtered.forEach(p => {
    const div = document.createElement('div');
    div.className = 'pool-item' + (assigned.has(p.id) ? ' assigned' : '');
    div.innerHTML = `<span>${nomeProdutoParaExibicao(p)}</span><span style="font-size:8px;color:#BDBDBD;margin:0 4px">${p.unidade}</span><span class="pool-add">+</span>`;
    div.onclick = () => { addProductToPage(openPage || pages[0].id, p.id); };
    list.appendChild(div);
  });
}
function adicionarTodosFiltrados() {
  const { filtered, analise } = produtosFiltradosDoPool();
  const catFilter = (document.getElementById('poolCatFilter') || {}).value || '';
  const searchRaw = ((document.getElementById('poolSearch') || {}).value || '').trim();
  if (!analise.ativo && !catFilter && !searchRaw) {
    showToast('Cole uma lista, escolha uma categoria ou faça uma busca antes de adicionar em massa.');
    return;
  }
  const targetId = openPage || pages[0].id;
  const pg = pages.find(p => p.id === targetId);
  if (!pg) return;
  if (!filtered.length) { showToast('Nenhum produto encontrado para adicionar.'); return; }

  const categoriaComSubcategorias = aplicarSubcategoriasDaLista(analise);
  const produtosParaAdicionar = analise.ativo && analise.produtosOrdenados?.length
    ? analise.produtosOrdenados.filter(p => filtered.some(f => f.id === p.id))
    : filtered;

  const resultado = moverProdutosParaPaginaComOverflow(targetId, produtosParaAdicionar);
  atualizarSubtitulosAutomaticos(categoriaComSubcategorias || pg.titulo);
  renderPanel(); renderPreview(); salvarDebounce();
  showToast(`${resultado.adicionados} produto${resultado.adicionados !== 1 ? 's' : ''} adicionado${resultado.adicionados !== 1 ? 's' : ''}${categoriaComSubcategorias ? ' · subtítulos preenchidos automaticamente' : ''}${resultado.novasPaginas ? ` · ${resultado.novasPaginas} nova${resultado.novasPaginas !== 1 ? 's' : ''} página${resultado.novasPaginas !== 1 ? 's' : ''} criada${resultado.novasPaginas !== 1 ? 's' : ''}` : ''}!`);
}
function distribuirTodosPorCategoria() {
  let distribuidos = 0, semPagina = 0;
  const semPaginaCats = new Set();

  const grupos = new Map();
  TODOS_PRODUTOS.forEach(p => {
    if (!grupos.has(p.categoria)) grupos.set(p.categoria, []);
    grupos.get(p.categoria).push(p.id);
  });

  grupos.forEach((ids, categoria) => {
    let paginasCategoria = pages.filter(pg => pg.titulo === categoria);
    if (!paginasCategoria.length) {
      semPagina += ids.length;
      semPaginaCats.add(categoria);
      return;
    }

    const idsSet = new Set(ids);
    pages.forEach(pg => { pg.produtos = pg.produtos.filter(id => !idsSet.has(id)); });

    let indicePagina = 0;
    ids.forEach(id => {
      while (indicePagina < paginasCategoria.length && paginasCategoria[indicePagina].produtos.length >= MAX_PRODUTOS_POR_PAGINA) indicePagina++;
      if (indicePagina >= paginasCategoria.length) {
        const nova = criarPaginaDepoisDa(paginasCategoria[paginasCategoria.length - 1], '');
        paginasCategoria.push(nova);
      }
      paginasCategoria[indicePagina].produtos.push(id);
      distribuidos++;
    });
  });

  atualizarSubtitulosAutomaticos();
  renderPanel(); renderPreview(); salvarDebounce();
  showToast(`${distribuidos} produto${distribuidos !== 1 ? 's' : ''} distribuído${distribuidos !== 1 ? 's' : ''} em páginas de até ${MAX_PRODUTOS_POR_PAGINA}` + (semPagina ? ` · ${semPagina} sem página correspondente` : ''));
  if (semPaginaCats.size) console.warn('Categorias sem página correspondente:', Array.from(semPaginaCats));
}
// ── DRAG PRODUTOS ENTRE PÁGINAS ──
function onDragStart(e, pid, prodId) { dragProdId = prodId; dragFromPage = pid; e.dataTransfer.effectAllowed = 'move'; }
function onDragOverZone(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeaveZone(e) { e.currentTarget.classList.remove('drag-over'); }
function onDropZone(e, pid) {
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if (dragProdId == null) return;
  const from = pages.find(p => p.id === dragFromPage);
  if (from) from.produtos = from.produtos.filter(id => id !== dragProdId);
  const to = pages.find(p => p.id === pid);
  if (to && !to.produtos.includes(dragProdId)) {
    if (to.produtos.length >= MAX_PRODUTOS_POR_PAGINA) {
      const nova = criarPaginaDepoisDa(to, '');
      nova.produtos.push(dragProdId);
      showToast('Página cheia: o produto foi colocado na próxima página.');
    } else {
      to.produtos.push(dragProdId);
    }
  }
  dragProdId = null; dragFromPage = null;
  atualizarSubtitulosAutomaticos();
  renderPanel(); renderPreview(); salvarDebounce();
}

// ── RENDER PAINEL ──
function renderPanel() {
  const list = document.getElementById('pagesList');
  if (!list) return;
  list.innerHTML = '';
  pages.forEach(pg => {
    const isOpen = openPage === pg.id;
    const div = document.createElement('div');
    div.className = 'page-item' + (isOpen ? ' open active' : '');
    div.draggable = true;
    div.dataset.pageId = pg.id;
    div.addEventListener('dragstart', e => {
      if (e.target.closest('.product-tag')) return;
      dragPageId = pg.id; e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => div.classList.add('dragging-page'), 0);
    });
    div.addEventListener('dragend', () => {
      dragPageId = null; div.classList.remove('dragging-page');
      document.querySelectorAll('.page-item').forEach(el => el.classList.remove('drag-page-over'));
    });
    div.addEventListener('dragover', e => {
      if (dragPageId == null || dragPageId === pg.id) return;
      e.preventDefault();
      document.querySelectorAll('.page-item').forEach(el => el.classList.remove('drag-page-over'));
      div.classList.add('drag-page-over');
    });
    div.addEventListener('drop', e => {
      if (dragPageId == null || dragPageId === pg.id) return;
      e.preventDefault(); div.classList.remove('drag-page-over');
      const fi = pages.findIndex(p => p.id === dragPageId);
      const ti = pages.findIndex(p => p.id === pg.id);
      if (fi === -1 || ti === -1) return;
      const [moved] = pages.splice(fi, 1);
      pages.splice(ti, 0, moved);
      dragPageId = null; renderPanel(); renderPreview();
    });
    const prods = pg.produtos.map(id => TODOS_PRODUTOS.find(p => p.id === id)).filter(Boolean);
    div.innerHTML = `
      <div class="page-header" onclick="togglePage(${pg.id})">
        <span class="page-drag-handle">⠿</span>
        <span class="page-color-strip" style="background:${pg.cor || colors_state.verdeEscuro}" onclick="event.stopPropagation()">
          <input type="color" value="${pg.cor || colors_state.verdeEscuro}" oninput="updatePageCor(${pg.id}, this.value)">
        </span>
        <span class="page-title-wrap"><span class="page-title">${pg.titulo}</span>${pg.subtitulo ? `<span class="page-subtitle">${pg.subtitulo}</span>` : ''}</span>
        <span class="page-count">${prods.length}/${MAX_PRODUTOS_POR_PAGINA}</span>
        <div class="page-actions" onclick="event.stopPropagation()">
          ${pg.cor ? `<button class="page-color-reset" onclick="resetPageCor(${pg.id})" title="Usar cor padrão">↺</button>` : ''}
          <button class="btn-sm danger" onclick="removePage(${pg.id})">✕</button>
        </div>
      </div>
      </div>
      <div class="page-edit-fields">
        <label>Título</label>
        <input type="text" value="${pg.titulo.replace(/"/g,'&quot;')}" oninput="updatePageTitulo(${pg.id}, this.value)">
        <label>Subtítulo / segunda categoria</label>
        <textarea rows="2" placeholder="Ex.: Embalagens para pizza, Escritório, Limpeza..." oninput="updatePageSubtitulo(${pg.id}, this.value)">${pg.subtitulo||''}</textarea>
      </div>
      <div class="page-products">
        ${prods.map(p => `<div class="product-tag" draggable="true" ondragstart="onDragStart(event,${pg.id},${p.id})">
          <span>${p.nome}</span>
          <button class="btn-remove-prod" onclick="removeProductFromPage(${pg.id},${p.id})">✕</button>
        </div>`).join('')}
        <div class="page-add-zone" ondragover="onDragOverZone(event)" ondragleave="onDragLeaveZone(event)" ondrop="onDropZone(event,${pg.id})">
          Arraste produtos aqui
        </div>
      </div>`;
    list.appendChild(div);
  });
  renderPool();
}

// ── SELEÇÃO ──
function _atualizaSelBar() {
  let bar = document.getElementById('selectionBar');
  if (_sel.items.size === 0) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.className = 'selection-bar'; bar.id = 'selectionBar'; document.body.appendChild(bar); }
  bar.innerHTML = `<span><span class="sel-count">${_sel.items.size}</span> produto${_sel.items.size>1?'s':''} selecionado${_sel.items.size>1?'s':''}</span>
    <button class="btn-sel-delete" onclick="_excluirSelecionados()">🗑 Excluir selecionados</button>
    <button class="btn-sel-cancel" onclick="_limparSelecao()">✕ Cancelar</button>`;
}
function _limparSelecao() {
  _sel.items.clear();
  document.querySelectorAll('.card.selecionado').forEach(c => c.classList.remove('selecionado'));
  const bar = document.getElementById('selectionBar'); if (bar) bar.remove();
}
function _excluirSelecionados() {
  const total = _sel.items.size;
  _sel.items.forEach((pgId, prodId) => {
    const pg = pages.find(p => p.id === pgId);
    if (pg) pg.produtos = pg.produtos.filter(id => id !== prodId);
    salvarDebounce()
  });
  _sel.items.clear();
  const bar = document.getElementById('selectionBar'); if (bar) bar.remove();
  renderPanel(); renderPreview();
  showToast(`${total} produto${total>1?'s':''} removido${total>1?'s':''}.`);
}

// ── RENDER PREVIEW ──
function renderPreview() {
  const wrap = document.getElementById('previewWrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  const PROD_POR_PAGINA = MAX_PRODUTOS_POR_PAGINA;
  let cardDragProdId = null, cardDragPageId = null;

  pages.forEach(pg => {
    const prods = pg.produtos.map(id => TODOS_PRODUTOS.find(p => p.id === id)).filter(Boolean);
    const fatias = prods.length === 0 ? [[]] : [];
    if (prods.length > 0) for (let i = 0; i < prods.length; i += PROD_POR_PAGINA) fatias.push(prods.slice(i, i+PROD_POR_PAGINA));

    fatias.forEach((fatia) => {
      const label = document.createElement('div');
      label.className = 'preview-label';
      label.textContent = `${pg.titulo}${pg.subtitulo ? ` · ${pg.subtitulo}` : ''}`;
      wrap.appendChild(label);

      const a4 = document.createElement('div'); a4.className = 'a4';
      a4.innerHTML = `
        <div class="a4-header">
          <div class="a4-logo-box">${logoDataUrl?`<img src="${logoDataUrl}" style="width:100%;height:100%;object-fit:contain">`:'PMG'}</div>
          <div class="a4-header-text">
            <div class="a4-title">${pg.titulo}</div>
            <div class="a4-subs">${pg.subtitulo||''}</div>
          </div>
        </div>`;
        const pal = paletaDaPagina(pg);
a4.style.setProperty('--verde-escuro', pal.verdeEscuro);
a4.style.setProperty('--verde-med',    pal.verdeMed);
a4.style.setProperty('--verde-claro',  pal.verdeClaro);
a4.style.setProperty('--verde-suave',  pal.verdeSuave);
a4.style.setProperty('--accent',       pal.accent);

      const grid = document.createElement('div'); grid.className = 'a4-grid';

      fatia.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card' + (_sel.items.has(p.id) ? ' selecionado' : '');
        card.draggable = true;
        card.innerHTML = `
          <div class="card-check">✓</div>
          <div class="card-img">${prodImages[p.id]
            ? `<img src="${prodImages[p.id]}" alt="${p.nome}">`
            : `<svg width="22" height="18" viewBox="0 0 22 18" fill="none">
                <rect x="1" y="4" width="20" height="13" rx="2" stroke="#BDBDBD" stroke-width="1.5"/>
                <circle cx="11" cy="10.5" r="3.5" stroke="#BDBDBD" stroke-width="1.5"/>
                <path d="M7 4l1.5-3h5L15 4" stroke="#BDBDBD" stroke-width="1.5"/>
              </svg><span>Imagem meramente<br>ilustrativa</span>`}
          </div>
          <div class="card-body"><div class="card-nome">${nomeProdutoParaExibicao(p)}</div></div>
          <div class="card-badge">${p.unidade}</div>`;

        card.addEventListener('click', () => {
          if (_sel.items.has(p.id)) { _sel.items.delete(p.id); card.classList.remove('selecionado'); }
          else { _sel.items.set(p.id, pg.id); card.classList.add('selecionado'); }
          _atualizaSelBar();
        });
        card.addEventListener('dragstart', e => {
          cardDragProdId = p.id; cardDragPageId = pg.id; e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => card.classList.add('dragging'), 0);
        });
        card.addEventListener('dragend', () => {
          cardDragProdId = null; card.classList.remove('dragging');
          grid.querySelectorAll('.card').forEach(c => c.classList.remove('drag-card-over'));
        });
        card.addEventListener('dragover', e => {
          if (cardDragProdId == null || cardDragProdId === p.id) return;
          e.preventDefault();
          grid.querySelectorAll('.card').forEach(c => c.classList.remove('drag-card-over'));
          card.classList.add('drag-card-over');
        });
        card.addEventListener('dragleave', () => card.classList.remove('drag-card-over'));
        card.addEventListener('drop', e => {
          e.preventDefault(); card.classList.remove('drag-card-over');
          if (!cardDragProdId || cardDragProdId === p.id || cardDragPageId !== pg.id) return;
          const fi2 = pg.produtos.indexOf(cardDragProdId), ti = pg.produtos.indexOf(p.id);
          if (fi2 === -1 || ti === -1) return;
          pg.produtos.splice(fi2, 1); pg.produtos.splice(ti, 0, cardDragProdId);
          cardDragProdId = null; renderPanel(); renderPreview();
        });
        grid.appendChild(card);
      });

      for (let i = 0; i < PROD_POR_PAGINA - fatia.length; i++) {
        const empty = document.createElement('div'); empty.className = 'card-empty'; empty.textContent = '—';
        grid.appendChild(empty);
      }

      a4.appendChild(grid);

const footer = document.createElement('div');
footer.className = 'a4-footer';
footer.innerHTML = `<span>PMG.com.br</span>
  <span class="pg">Atacadista de Alimentos e Bebidas</span>`;
a4.appendChild(footer);

wrap.appendChild(a4);
    });
  });
}

// ── EXPORT PDF ──
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

  const a4s = document.querySelectorAll('.a4');
  let promessas = [];

  a4s.forEach((a4, i) => {
    promessas.push(
      html2canvas(a4, { scale: 2, useCORS: true, backgroundColor: '#fff' }).then(canvas => {
        return { i, canvas };
      })
    );
  });

  showToast('Gerando PDF, aguarde...');

  Promise.all(promessas).then(resultados => {
    resultados.sort((a, b) => a.i - b.i);
    resultados.forEach(({ canvas }, idx) => {
      if (idx > 0) doc.addPage();
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    });
    doc.save('catalogo-pmg.pdf');
    showToast('PDF baixado!');
  }).catch(err => {
    console.error(err);
    showToast('Erro ao gerar PDF.');
  });
}

// ── SALVAR/CARREGAR NO PRÓPRIO NAVEGADOR (localStorage) ──
const STORAGE_KEY = 'catalogoPMG_estado';

function salvarEstado() {
  const estado = {
    pages: pages.map(pg => ({
  id: pg.id, titulo: pg.titulo, subtitulo: pg.subtitulo, subtituloAuto: !!pg.subtituloAuto,
  produtos: pg.produtos, cor: pg.cor || null
})),
    nextPageId,
    openPage,
    colors_state,
    logoDataUrl,
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
  } catch (err) {
    console.error('Erro ao salvar estado (localStorage cheio?):', err);
    showToast('Não foi possível salvar — armazenamento local cheio.');
  }
}

function carregarEstado() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const estado = JSON.parse(raw);
    if (!estado || !estado.pages || estado.pages.length === 0) return false;
    pages        = estado.pages.map(pg => ({ ...pg, subtituloAuto: !!pg.subtituloAuto }));
    const maiorIdPagina = pages.reduce((maior, pg) => Math.max(maior, Number(pg.id) || 0), 0);
    nextPageId   = Math.max(Number(estado.nextPageId) || 0, maiorIdPagina + 1, pages.length + 1);
    const paginasMigradas = normalizarPaginasParaLimite();
    openPage     = estado.openPage || null;
    colors_state = estado.colors_state || colors_state;
    logoDataUrl  = estado.logoDataUrl || null;
    applyColors();
    if (paginasMigradas) salvarEstado();
    return true;
  } catch (err) {
    console.error('Erro ao carregar estado:', err);
    return false;
  }
}
let _salvarTimeout = null;
function salvarDebounce() {
  clearTimeout(_salvarTimeout);
  _salvarTimeout = setTimeout(salvarEstado, 400);
}
// ── SINCRONIZAR API ──
async function sincronizarAPI() {
  const btn    = document.getElementById('btnSincAPI');
  const status = document.getElementById('api-status');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.7'; }
  if (status) status.textContent = '⏳ Carregando produtos...';

  let dados = null;
  try {
    // O endpoint mantém limite de 100 para telas leves. O Gerador precisa do
    // catálogo inteiro, então solicita explicitamente todos os produtos.
    const resp = await fetch('/api/produtos-supabase?todos=true&refresh=true', {
      cache: 'no-store'
    });
    if (!resp.ok) {
      let detalhe = '';
      try { detalhe = (await resp.json())?.erro || ''; } catch (_) {}
      throw new Error(`HTTP ${resp.status}${detalhe ? ` · ${detalhe}` : ''}`);
    }
    dados = await resp.json();
    if (!Array.isArray(dados)) throw new Error('A API não retornou uma lista de produtos.');
    console.log('Total recebido:', dados.length, '| Total informado pela API:', resp.headers.get('X-PMG-Catalog-Total'), '| Exemplo:', dados[0]);
  } catch (err) {
    if (status) status.innerHTML = `❌ Falha: ${err.message}`;
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
    return;
  }

  TODOS_PRODUTOS.length = 0;

  let adicionados = 0, semCategoria = 0;
  const idsSemMapa = new Set();

  dados.forEach(item => {
    const id        = item.id;
    const nome      = (item.nome || '').trim().toUpperCase();
    const unidade   = extrairUnidade(nome);
    const categoria = idsParaCategoria(item.id_categoria);
    const imagemURL = item.imagem ? item.imagem.replace(/\\/g, '/') : null;

    if (!nome || !categoria) {
      semCategoria++;
      if (!MAPA_CATEGORIAS[String(item.id_categoria)]) idsSemMapa.add(item.id_categoria);
      return;
    }

    garantirCategoria(categoria);
    TODOS_PRODUTOS.push({ id, nome, unidade, categoria, idSubcategoria: item.id_subcategoria ?? null });

    if (imagemURL && !prodImages[id]) {
      prodImages[id] = `/img-proxy?url=${encodeURIComponent(imagemURL)}`;
    }
    adicionados++;
  });

  catalogoProdutosRevisao++;
  if (TODOS_PRODUTOS.length > 0) {
    const maxId = TODOS_PRODUTOS.reduce((acc, p) => p.id > acc ? p.id : acc, 0);
    if (nextProdId <= maxId) nextProdId = maxId + 1;
  }

  if (status) status.innerHTML = `✅ ${adicionados} produtos · ${semCategoria} sem categoria`;
  if (idsSemMapa.size > 0) console.warn('IDs sem mapa:', Array.from(idsSemMapa));
  showToast(`Sincronizado! ${adicionados} produtos carregados.`);
  renderPool();
  if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
}
