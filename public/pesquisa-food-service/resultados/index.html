<head>

<style>
:root{
  --bg:#2B0714; --bg-2:#360A1B; --bg-3:#41101F; --cream:#F6DFC4; --dim:rgba(246,223,196,.64); --faint:rgba(246,223,196,.32);
  --line:rgba(246,223,196,.14); --coral:#FF4F38; --tang:#FF7A2F; --amber:#FFB22E;
  --grad:linear-gradient(95deg,#FF4F38 0%,#FF7A2F 45%,#FFB22E 100%);
  --display:"Barlow Condensed","Oswald","Arial Narrow",sans-serif; --sans:"Montserrat",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --back:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#14030A;color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.viewport{position:fixed;inset:0;display:grid;place-items:center}
.stage{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center;background:var(--bg);overflow:hidden}
/* fundo vivo */
.bgfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;will-change:transform}
.orb.o1{width:1300px;height:1300px;right:-380px;top:-460px;background:radial-gradient(circle,rgba(255,79,56,.26),rgba(255,79,56,0) 62%);animation:drift1 22s ease-in-out infinite alternate}
.orb.o2{width:1000px;height:1000px;left:-360px;bottom:-520px;background:radial-gradient(circle,rgba(255,178,46,.16),rgba(255,178,46,0) 62%);animation:drift2 26s ease-in-out infinite alternate}
.orb.o3{width:700px;height:700px;left:38%;top:30%;background:radial-gradient(circle,rgba(255,122,47,.10),rgba(255,122,47,0) 65%);animation:drift3 18s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-220px,160px) scale(1.12)}}
@keyframes drift2{to{transform:translate(260px,-120px) scale(1.18)}}
@keyframes drift3{to{transform:translate(-180px,-140px) scale(.85)}}
.grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.lines{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(246,223,196,.022) 0 1px,transparent 1px 64px)}
/* slides */
.slide{position:absolute;inset:0;padding:92px 120px 120px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(1.02);transition:opacity .7s ease,transform .9s var(--ease),visibility 0s linear .7s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .7s ease .15s,transform .9s var(--ease) .15s}
.slide.out{transform:scale(.97)}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* entradas */
.a{opacity:0;transform:translateY(34px)}
.slide.on .a{animation:up .95s var(--ease) var(--d,0s) both}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.pop{opacity:0;transform:scale(.86)}
.slide.on .pop{animation:pop .8s var(--back) var(--d,0s) both}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.kin .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em;margin-bottom:-.06em}
.kin .w i{display:inline-block;font-style:normal;transform:translateY(108%)}
.slide.on .kin .w i{animation:rise 1s var(--ease) var(--d,0s) both}
@keyframes rise{from{transform:translateY(108%)}to{transform:none}}
.kick{font:600 22px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:18px}
.kick:before{content:"";width:56px;height:2px;background:var(--grad);transform-origin:left}
.slide.on .kick:before{animation:sweep 1s var(--ease) .2s both}
@keyframes sweep{from{transform:scaleX(0)}to{transform:none}}
.qtext{font:500 30px/1.35 var(--sans);color:var(--dim);max-width:1560px;margin-top:22px}
/* anel + número */
.body{flex:1;display:grid;grid-template-columns:600px 1fr;gap:100px;align-items:center;margin-top:24px}
.hero{display:flex;flex-direction:column;align-items:flex-start}
.ring{position:relative;width:420px;height:420px}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tk{fill:none;stroke:rgba(246,223,196,.09);stroke-width:12}
.ring .pg{fill:none;stroke:url(#gRing);stroke-width:12;stroke-linecap:round;stroke-dasharray:553;stroke-dashoffset:553;filter:drop-shadow(0 0 14px rgba(255,122,47,.45))}
.slide.on .ring .pg{animation:ring 1.8s var(--ease) .35s forwards}
@keyframes ring{to{stroke-dashoffset:var(--off)}}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:800 190px/.8 var(--display);letter-spacing:-.01em}
.ring .num>span{display:block;white-space:nowrap}
.ring .num small{font-size:.4em}
.hl{font:700 52px/1.04 var(--display);text-transform:uppercase;margin-top:34px;max-width:600px}
/* barras */
.bars{display:grid;gap:22px}
.bar{display:grid;grid-template-columns:1fr 140px;align-items:center;gap:26px}
.bar .lab{font:600 26px/1.2 var(--sans);margin-bottom:10px;color:var(--cream)}
.bar .track{height:30px;border-radius:999px;background:rgba(246,223,196,.07);overflow:hidden}
.bar .fill{height:100%;width:var(--w);border-radius:999px;background:rgba(246,223,196,.32);transform:scaleX(0);transform-origin:left}
.slide.on .bar .fill{animation:grow 1.3s var(--ease) var(--d,0s) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.bar.top .fill{background:var(--grad);box-shadow:0 0 30px rgba(255,122,47,.45)}
.bar .v{font:700 54px/1 var(--display);text-align:right}
.bar.top .v{color:var(--amber)}
.bar.dim .lab{color:var(--dim)}
.bars.compact{gap:14px}
.bars.compact .bar .lab{font-size:22px;margin-bottom:7px}
.bars.compact .bar .track{height:22px}
.bars.compact .bar .v{font-size:42px}
/* empilhado */
.stackwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:56px;margin-top:10px}
.stackhl{display:flex;align-items:flex-end;gap:44px}
.stackhl .big{font:800 260px/.8 var(--display)}
.stackhl .big small{font-size:.4em}
.stackhl .hl{margin:0 0 18px;max-width:900px;font-size:64px}
.stack{display:flex;height:150px;border-radius:26px;overflow:hidden;clip-path:inset(0 100% 0 0 round 26px)}
.slide.on .stack{animation:reveal 1.6s var(--ease) .5s forwards}
@keyframes reveal{to{clip-path:inset(0 0 0 0 round 26px)}}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font:800 64px/1 var(--display);color:#2B0714;min-width:0;overflow:hidden}
.seg.s0{background:var(--grad)}.seg.s1{background:#FF7A2F}.seg.s2{background:#F7A27C}.seg.s3{background:rgba(246,223,196,.35);color:var(--cream)}
.stackleg{display:flex;gap:40px}
.stackleg div{flex:1;display:flex;gap:14px;align-items:flex-start;font:600 24px/1.25 var(--sans);color:var(--dim)}
.stackleg i{flex:none;width:22px;height:22px;border-radius:6px;margin-top:3px}
/* ranking 1 a 5 */
.rank{display:grid;gap:16px}
.rrow{display:grid;grid-template-columns:330px 1fr 110px;align-items:center;gap:26px}
.rrow .lab{font:600 25px/1.2 var(--sans)}
.rtrack{position:relative;height:16px;border-radius:999px;background:rgba(246,223,196,.07)}
.rtrack:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(246,223,196,.16) calc(25% - 1px) 25%)}
.rfill{position:absolute;left:0;top:0;bottom:0;width:var(--w);border-radius:999px;background:rgba(246,223,196,.3);transform:scaleX(0);transform-origin:left}
.rdot{position:absolute;top:50%;left:var(--w);width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--cream);opacity:0;transform:scale(0)}
.slide.on .rfill{animation:grow 1.3s var(--ease) var(--d,0s) both}
.slide.on .rdot{animation:dot .6s var(--back) calc(var(--d,0s) + 1s) both}
@keyframes dot{to{opacity:1;transform:none}}
.rrow.top .rfill{background:var(--grad)}
.rrow.top .rdot{background:var(--amber);box-shadow:0 0 0 8px rgba(255,178,46,.18),0 0 30px rgba(255,178,46,.6)}
.rrow .v{font:700 50px/1 var(--display);text-align:right}
.rrow.top .v{color:var(--amber)}
.scale5{display:grid;grid-template-columns:330px 1fr 110px;gap:26px;font:600 16px var(--sans);color:var(--faint);margin-bottom:4px}
.scale5 div{display:flex;justify-content:space-between}
/* blocos */
.tiles{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:20px;margin-top:40px}
.tile{position:relative;border:1px solid var(--line);border-radius:24px;background:rgba(246,223,196,.04);padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tile .p{font:800 86px/.85 var(--display)}
.tile .p small{font-size:.45em}
.tile .l{font:600 23px/1.25 var(--sans);color:var(--dim)}
.tile .meter{position:absolute;left:0;bottom:0;height:6px;width:var(--w);background:rgba(246,223,196,.25);transform:scaleX(0);transform-origin:left}
.slide.on .tile .meter{animation:grow 1.2s var(--ease) calc(var(--d,0s) + .3s) both}
.tile.top{border-color:rgba(255,122,47,.6);background:linear-gradient(160deg,rgba(255,79,56,.22),rgba(255,178,46,.06));box-shadow:0 20px 60px rgba(255,79,56,.18)}
.tile.top .l{color:var(--cream)}
.tile.top .meter{background:var(--grad)}
.tile.zero{opacity:.45}
.tile .rk{position:absolute;right:22px;top:20px;font:700 22px var(--display);color:var(--amber);letter-spacing:.06em}
/* pódio */
.podwrap{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:90px;align-items:end;margin-top:30px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:end;height:680px}
.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.col .pv{font:800 96px/.85 var(--display);text-align:center;margin-bottom:16px}
.col .pv small{font-size:.45em}
.col .blk{height:var(--h);border-radius:22px 22px 6px 6px;background:rgba(246,223,196,.14);transform:scaleY(0);transform-origin:bottom;display:flex;align-items:flex-start;justify-content:center;padding-top:22px;font:800 54px var(--display);color:rgba(43,7,20,.55)}
.slide.on .col .blk{animation:growY 1.3s var(--ease) var(--d,0s) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
.col.c1 .blk{background:var(--grad);box-shadow:0 0 60px rgba(255,122,47,.35)}
.col.c2 .blk,.col.c3 .blk{background:rgba(246,223,196,.22);color:rgba(246,223,196,.5)}
.col .pl{font:600 24px/1.25 var(--sans);text-align:center;margin-top:18px;min-height:90px;color:var(--cream)}
.col.c2 .pl,.col.c3 .pl{color:var(--dim)}
.rest{display:grid;gap:18px;padding-bottom:110px}
.rest .ttl{font:600 18px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.ritem{display:grid;grid-template-columns:1fr 90px;gap:18px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px}
.ritem span{font:600 23px/1.3 var(--sans);color:var(--dim)}
.ritem b{font:700 40px/1 var(--display);text-align:right}
.podhl{display:flex;align-items:baseline;gap:22px;margin-top:20px}
.podhl .hl{margin:0;max-width:none;font-size:46px}
/* capítulos */
.chapter{justify-content:center}
.chapter .ct{font:800 210px/.84 var(--display);text-transform:uppercase;margin-top:34px;max-width:1600px}
.chapter .cs{font:500 36px/1.35 var(--sans);color:var(--dim);margin-top:40px;max-width:1100px}
.chapter .bar2{width:420px;height:6px;border-radius:6px;background:var(--grad);margin-top:56px;transform:scaleX(0);transform-origin:left}
.slide.on.chapter .bar2{animation:sweep 1.2s var(--ease) .9s both}
.chapter .ghost{position:absolute;right:80px;bottom:60px;font:800 420px/.8 var(--display);text-transform:uppercase;color:transparent;-webkit-text-stroke:2px rgba(246,223,196,.08);white-space:nowrap}
/* capa */
.cover{justify-content:center}
.cover .t1{font:800 160px/.86 var(--display);text-transform:uppercase;max-width:1300px;margin-top:34px}
.cover .meta{display:flex;align-items:flex-end;gap:50px;margin-top:70px}
.cover .num{font:800 230px/.8 var(--display)}
.cover .numl{font:600 30px/1.3 var(--sans);color:var(--dim);max-width:440px;padding-bottom:18px}
.cover .badge{position:absolute;right:120px;top:92px;display:flex;align-items:center;gap:18px;font:600 22px var(--sans);color:var(--dim)}
.cover .badge img{width:84px;height:84px;border-radius:14px}
.orbit{position:absolute;right:120px;top:50%;width:620px;height:620px;margin-top:-250px;pointer-events:none}
.orbit svg{width:100%;height:100%;animation:spin 60s linear infinite}
.orbit .o{fill:none;stroke:rgba(246,223,196,.14);stroke-width:1.2;stroke-dasharray:3 9}
.orbit .o2{fill:none;stroke:url(#gRing);stroke-width:3;stroke-dasharray:180 1200;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit .dot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--amber);box-shadow:0 0 30px var(--amber);left:50%;top:-9px;margin-left:-9px}
.orbit .rot{position:absolute;inset:0;animation:spin 14s linear infinite}
/* tipos */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px 90px;margin-top:56px}
/* nuvem */
.cloud{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:14px 42px;padding:10px 80px 40px}
.cloud span{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:1;color:var(--cream);opacity:0;transform:scale(.6);display:inline-block}
.slide.on .cloud span{animation:pop .8s var(--back) var(--d,0s) both,float var(--f,6s) ease-in-out calc(var(--d,0s) + .8s) infinite alternate}
@keyframes float{from{translate:0 0}to{translate:0 -10px}}
.cloud span.h{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cloud span.m{color:var(--dim)}
.empty{flex:1;display:grid;place-items:center;font:600 34px var(--sans);color:var(--faint);text-align:center}
.end{justify-content:center}
.end .t1{font:800 180px/.86 var(--display);text-transform:uppercase;max-width:1500px}
.end p{font:500 34px/1.4 var(--sans);color:var(--dim);margin-top:40px;max-width:1150px}
/* rodapé */
.foot{position:absolute;left:120px;right:120px;bottom:48px;display:flex;align-items:center;gap:22px;font:500 19px var(--sans);color:var(--faint)}
.foot img{width:44px;height:44px;border-radius:8px}
.foot .sp{margin-left:auto}
.foot b{color:var(--dim);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;font:600 17px var(--sans);color:var(--dim)}
.pill.warn{border-color:rgba(255,178,46,.5);color:var(--amber)}
.pill.demo{border-color:rgba(255,79,56,.7);color:#fff;background:rgba(255,79,56,.25)}
.live{display:inline-flex;align-items:center;gap:10px;color:var(--dim);font-weight:600}
.live i{width:10px;height:10px;border-radius:50%;background:#3BD16F;box-shadow:0 0 0 0 rgba(59,209,111,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(59,209,111,0)}100%{box-shadow:0 0 0 0 rgba(59,209,111,0)}}
/* controles */
.ctl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px;border-radius:14px;background:rgba(20,3,10,.88);border:1px solid var(--line);z-index:5;transition:opacity .4s;font:600 13px var(--sans)}
.ctl.hide{opacity:0;pointer-events:none}
.ctl button,.ctl select{background:rgba(246,223,196,.08);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
.ctl select option{color:#111}
.ctl .cnt{color:var(--dim);padding:0 6px;min-width:70px;text-align:center}
.ctl button.on{background:var(--grad);color:#2B0714;border-color:transparent}
.prog{position:fixed;left:0;top:0;height:4px;background:var(--grad);z-index:6;transition:width .6s var(--ease);box-shadow:0 0 14px rgba(255,122,47,.6)}
@media (prefers-reduced-motion:reduce){.orb,.orbit svg,.orbit .rot{animation:none!important}}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;height:auto;background:var(--bg)}
  .viewport{position:static;display:block}
  .stage{transform:none!important;width:auto;height:auto;background:none;overflow:visible}
  .bgfx{display:none}
  .slide{position:relative;width:1920px;height:1080px;opacity:1!important;visibility:visible!important;transform:none!important;page-break-after:always;break-after:page;background:radial-gradient(60% 70% at 85% 25%,rgba(255,79,56,.2),transparent 70%),var(--bg);overflow:hidden}
  .a,.pop,.kin .w i,.cloud span,.rdot,.chapter .bar2{opacity:1!important;transform:none!important;animation:none!important}
  .bar .fill,.rfill,.tile .meter,.col .blk,.kick:before{transform:none!important;animation:none!important}
  .stack{clip-path:none!important;animation:none!important}
  .ring .pg{stroke-dashoffset:var(--off)!important;animation:none!important;filter:none!important}
  .bar.top .fill,.tile.top,.col.c1 .blk,.rrow.top .rdot{box-shadow:none!important}
  .ctl,.prog{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

    var to=+el.dataset.to, dec=+el.dataset.dec, delay=+el.dataset.delay, dur=1500, t0=null;
    if(instant){ el.textContent=fmt(to,dec); return; }
    el.textContent=fmt(0,dec);
    function step(ts){ if(t0===null) t0=ts+delay; var k=Math.min(1,Math.max(0,(ts-t0)/dur)); var e=1-Math.pow(2,-10*k); el.textContent=fmt(k>=1?to:to*e,dec); if(k<1) raf.push(requestAnimationFrame(step)); }

  cur=(i+slidesEl.length)%slidesEl.length;
  slidesEl.forEach(function(s,j){ s.classList.toggle('on',j===cur); s.classList.toggle('out',s===prev&&j!==cur); });
  runCounters(slidesEl[cur]);
  document.getElementById('cnt').textContent=(cur+1)+' / '+slidesEl.length;
  document.getElementById('prog').style.width=((cur+1)/slidesEl.length*100)+'%';
  try{ var u=new URL(location.href); u.searchParams.set('slide',cur); history.replaceState(null,'',u); }catch(e){}
  if(autoT){ clearTimeout(autoT); schedule(); }
}
function fit(){ var s=Math.min(innerWidth/1920,innerHeight/1080); wrap.style.transform='scale('+s+')'; }
addEventListener('resize',fit); fit();

/* controles */
var ctl=document.getElementById('ctl'), hideT;
function wake(){ ctl.classList.remove('hide'); clearTimeout(hideT); hideT=setTimeout(function(){ ctl.classList.add('hide'); },3000); }
addEventListener('mousemove',wake); wake();
document.getElementById('bPrev').onclick=function(){ go(cur-1); };
document.getElementById('bNext').onclick=function(){ go(cur+1); };
document.getElementById('bFull').onclick=full;
document.getElementById('bPrint').onclick=function(){ stopAuto(); slidesEl.forEach(function(s){ runCounters(s,true); }); setTimeout(function(){ print(); runCounters(slidesEl[cur]); },300); };
document.getElementById('bAuto').onclick=function(){ autoT?stopAuto():startAuto(); };
document.getElementById('fTipo').onchange=function(e){ tipoSel=e.target.value; LAST_SIG=''; try{ var u=new URL(location.href); if(tipoSel) u.searchParams.set('tipo',tipoSel); else u.searchParams.delete('tipo'); history.replaceState(null,'',u); }catch(er){} load(); };
function full(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
function schedule(){ var short=slidesEl[cur]&&slidesEl[cur].dataset.short; autoT=setTimeout(function(){ go(cur+1); },(short?Math.max(4,AUTO_S*.5):AUTO_S)*1000); }
function startAuto(){ document.getElementById('bAuto').classList.add('on'); autoT=1; clearTimeout(autoT); schedule(); }
function stopAuto(){ clearTimeout(autoT); autoT=null; document.getElementById('bAuto').classList.remove('on'); }
addEventListener('keydown',function(e){
  if(e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(e.key==='f'||e.key==='F') full();
  else if(e.key==='a'||e.key==='A') autoT?stopAuto():startAuto();
  else if(e.key==='Home') go(0);
});
stage.addEventListener('click',function(e){ var x=e.clientX/innerWidth; go(x<.3?cur-1:cur+1); });
addEventListener('beforeprint',function(){ slidesEl.forEach(function(s){ runCounters(s,true); }); });
if(qs.get('auto')) startAuto();

load();
if(!DEMO&&!ATE) setInterval(load,30000);
})();
</script>
</body>
